# Installed as /etc/nginx/conf.d/chatdesk-speed.conf by deploy/aws/update.sh
# (and setup_server.sh). Ubuntu's nginx.conf already turns gzip on but only
# compresses HTML; this adds the API's JSON answers - typically 5-10x
# smaller, which matters on a phone or campus Wi-Fi far from Sydney.
gzip_types application/json text/plain text/css application/javascript;
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
