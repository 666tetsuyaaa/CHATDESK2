# nginx in front of the Django API on the EC2 server.
# Browser/app --HTTPS--> nginx (this file, ports 80/443) --> gunicorn
# (127.0.0.1:8000). nginx also serves the admin CSS/JS and the uploaded
# profile pictures straight from disk.
#
# Installed by deploy/aws/setup_server.sh as /etc/nginx/sites-available/chatdesk.
# deploy/aws/enable_https.sh then puts your DuckDNS name in server_name and
# runs certbot, which adds the HTTPS (443) part and the HTTP->HTTPS redirect
# to the installed copy (lines marked "managed by Certbot").

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Profile pictures are capped at 2 MB by the API; leave some headroom.
    client_max_body_size 5M;

    location /static/ {
        alias /srv/chatdesk/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/chatdesk/backend/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Django the visitor used HTTPS (PROXY_SSL_HEADER in .env).
        # nginx sets it itself, so a visitor can't fake it.
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat reply can take ~30 s (OpenAI); the calendar PDF import longer.
        proxy_read_timeout 180s;
    }
}
